<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2c27d"/>
      <stop offset="100%" style="stop-color:#c9a84c"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Camera body -->
  <rect x="96" y="176" width="320" height="220" rx="32" fill="none" stroke="url(#accent)" stroke-width="22"/>

  <!-- Camera notch top -->
  <path d="M196 176 L216 136 Q220 124 232 124 L280 124 Q292 124 296 136 L316 176Z" fill="url(#accent)"/>

  <!-- Lens outer -->
  <circle cx="256" cy="290" r="72" fill="none" stroke="url(#accent)" stroke-width="20"/>

  <!-- Lens inner -->
  <circle cx="256" cy="290" r="38" fill="url(#accent)" opacity="0.85"/>

  <!-- L letter -->
  <text x="256" y="308" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#1a1a2e" text-anchor="middle">L</text>

  <!-- Shutter dot top right -->
  <circle cx="366" cy="212" r="14" fill="url(#accent)"/>
</svg>
